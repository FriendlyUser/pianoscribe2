# Static frontend + reverse proxy to the API.
limit_req_zone $binary_remote_addr zone=submit:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resolve the API through Docker's DNS at request time, so the proxy keeps
    # working when the api container is recreated and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Uploads are streamed straight through; the API enforces the size limit
    # (PS_MAX_UPLOAD_MB) as bytes arrive. This is only an outer ceiling.
    client_max_body_size 2g;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/jobs/upload {
        limit_req zone=submit burst=10 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $api_upstream;
    }

    location = /api/jobs/youtube {
        limit_req zone=submit burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass $api_upstream;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: no buffering, long-lived.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_pass $api_upstream;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }
}
